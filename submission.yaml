submission:
  title: "Clutch Nexus — Supply Chain Disruption Assistant & Fleet Utilisation Optimizer"  # REQUIRED

  problem_statement: >                 # REQUIRED — 1-3 sentences. What problem? Who has it?
    Global supply chain disruptions create cascading network impacts, causing millions in stranded cargo, cold-chain spoilage, and severe fleet under-utilisation (averaging 52.9%). Logistics operators lack real-time visibility to rapidly quantify cascading risk across shipments, routes, and thermal constraints to execute optimal fleet recovery actions.

  solution_summary: >                  # REQUIRED — 1-3 sentences. What did you build?
    Clutch Nexus is a real-time Control Tower combining automated Impact Cascade analysis, Google OR-Tools CP-SAT mathematical fleet optimization, real-time IoT cold-chain excursion monitoring, and What-If scenario simulation to rapidly recover network capacity and protect high-value cargo.

  key_features:                        # REQUIRED — List 3 to 5 specific features you implemented
    - "Real-Time Disruption & Impact Cascade Engine: Traces port failures to affected shipments, routes, and risk exposure"
    - "Google OR-Tools CP-SAT Fleet Optimizer: Dynamically matches idle fleet capacity with stranded cargo"
    - "Cold-Chain Telemetry & Excursion Alerting: IoT sensor tracking with instant breach notifications"
    - "What-If Scenario Simulator: Evaluates delay and financial trade-offs of rerouting options"
    - "Interactive Multimodal Topology Map: Leaflet visualizer for ports, sea/air routes, and active disruptions"

  tech_stack:
    languages:
      - "TypeScript"
      - "Python"
    frameworks:
      - "Next.js 14"
      - "FastAPI"
      - "Tailwind CSS"
    ibm_technologies:
      - "IBM Bob"
    databases:
      - "SQLite"
      - "SQLAlchemy"
    other:
      - "Google OR-Tools CP-SAT"
      - "Recharts"
      - "Leaflet"
      - "Pydantic v2"

  what_we_are_most_proud_of: >         # Optional but recommended — guides judges to your best work
    Our end-to-end Impact Cascade Engine and Google OR-Tools CP-SAT fleet optimizer, which turn complex multi-node supply chain disruptions into instant, actionable recovery plans with verifiable risk reduction metrics.

  known_limitations: >                 # Optional but recommended — be honest about gaps
    The prototype uses synthetic seeded telemetry data for 30 shipments and 16 ports. Generative AI integration (Gemini 3.6 Flash / watsonx.ai) is fully architected with deterministic rule-based fallback when live API keys are unconfigured.

